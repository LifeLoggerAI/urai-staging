name: Admin PR57 Protected Provider Probe

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/admin-pr57-provider-probe.yml
      - scripts/validate-admin-pr57-provider-probe.mjs
      - scripts/bootstrap-staging-github-wif.sh
      - .github/workflows/ci.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: urai-admin-pr57-provider-probe
  cancel-in-progress: false

env:
  STAGING_PROJECT_ID: urai-staging
  ADMIN_REPOSITORY: LifeLoggerAI/urai-admin
  ADMIN_PR_NUMBER: '57'
  ADMIN_SHA: fb255310d6b183a59e4252da80c685f45e5cf536
  FIREBASE_CLI_VERSION: '15.23.0'
  URAI_PRODUCTION_DEPLOY_APPROVED: '0'

jobs:
  provider-probe:
    name: Read-only WIF IAM and runtime identity probe
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_STAGING_DEPLOY_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout exact staging controller
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Prove exact staging and Admin authority
        shell: bash
        run: |
          set -euo pipefail
          test '${{ github.ref }}' = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')" = '${{ github.sha }}'
          test "$(git ls-remote --exit-code https://github.com/LifeLoggerAI/urai-admin.git refs/pull/57/head | awk '{print $1}')" = "$ADMIN_SHA"
          test "$STAGING_PROJECT_ID" = 'urai-staging'
          test "$URAI_PRODUCTION_DEPLOY_APPROVED" = '0'

      - name: Checkout exact reviewed Admin candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: LifeLoggerAI/urai-admin
          ref: ${{ env.ADMIN_SHA }}
          path: admin-source
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Prove exact clean Admin candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C admin-source rev-parse HEAD)" = "$ADMIN_SHA"
          test -z "$(git -C admin-source status --porcelain --untracked-files=all)"

      - name: Write pre-auth evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/provider
          WIF_PROVIDER="$WIF_PROVIDER" DEPLOY_SERVICE_ACCOUNT="$DEPLOY_SERVICE_ACCOUNT" node <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync('artifacts/provider/pre-auth.json', `${JSON.stringify({
            schemaVersion: 'urai-admin-pr57-provider-probe-2',
            generatedAt: new Date().toISOString(),
            stagingRepository: process.env.GITHUB_REPOSITORY,
            stagingControllerSha: process.env.GITHUB_SHA,
            adminRepository: process.env.ADMIN_REPOSITORY,
            adminPullRequest: Number(process.env.ADMIN_PR_NUMBER),
            adminCandidateSha: process.env.ADMIN_SHA,
            projectId: process.env.STAGING_PROJECT_ID,
            workflowRunId: process.env.GITHUB_RUN_ID,
            productionDeploymentApproved: false,
            mutationAuthorized: false,
            probeMode: 'provider-read-only',
            wifProviderConfigured: Boolean(process.env.WIF_PROVIDER),
            deployServiceAccountConfigured: Boolean(process.env.DEPLOY_SERVICE_ACCOUNT),
            wifProviderResource: process.env.WIF_PROVIDER || null,
            deployServiceAccountEmail: process.env.DEPLOY_SERVICE_ACCOUNT || null,
            secretValuesIncluded: false,
          }, null, 2)}\n`);
          NODE

      - name: Require protected staging WIF variables
        id: require-wif
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WIF_PROVIDER" || { echo 'GCP_WIF_PROVIDER is missing from the staging environment/repository variables.' >&2; exit 41; }
          test -n "$DEPLOY_SERVICE_ACCOUNT" || { echo 'GCP_STAGING_DEPLOY_SERVICE_ACCOUNT is missing from the staging environment/repository variables.' >&2; exit 42; }
          case "$WIF_PROVIDER" in projects/*/locations/global/workloadIdentityPools/*/providers/*) ;; *) exit 43 ;; esac
          case "$DEPLOY_SERVICE_ACCOUNT" in *@urai-staging.iam.gserviceaccount.com) ;; *) exit 44 ;; esac

      - name: Authenticate with protected WIF
        id: google-auth
        if: steps.require-wif.outcome == 'success'
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: urai-staging
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_STAGING_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Verify ephemeral ADC provenance
        id: adc-boundary
        if: steps.google-auth.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -n "${GOOGLE_GHA_CREDS_PATH:-}"
          test "$GOOGLE_APPLICATION_CREDENTIALS" = "$GOOGLE_GHA_CREDS_PATH"
          test -f "$GOOGLE_APPLICATION_CREDENTIALS"
          case "$GOOGLE_APPLICATION_CREDENTIALS" in "$GITHUB_WORKSPACE"/gha-creds-*.json) ;; *) exit 45 ;; esac
          git check-ignore -q "$GOOGLE_APPLICATION_CREDENTIALS"
          test "${GOOGLE_CLOUD_PROJECT:-urai-staging}" = 'urai-staging'
          test -z "${FIREBASE_TOKEN:-}"
          test -z "${FIREBASE_SERVICE_ACCOUNT_KEY:-}"
          test -z "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}"

      - name: Setup pinned gcloud
        id: setup-gcloud
        if: steps.adc-boundary.outcome == 'success'
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: urai-staging

      - name: Install pinned Firebase CLI outside repositories
        id: firebase-cli
        if: steps.adc-boundary.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cli_root="$RUNNER_TEMP/firebase-cli"
          mkdir -p "$cli_root"
          npm install --prefix "$cli_root" --no-audit --no-fund "firebase-tools@$FIREBASE_CLI_VERSION"
          test "$("$cli_root/node_modules/.bin/firebase" --version)" = "$FIREBASE_CLI_VERSION"
          echo "$cli_root/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Collect complete provider-native read-only evidence
        id: provider-read
        if: steps.setup-gcloud.outcome == 'success' && steps.firebase-cli.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          raw="$RUNNER_TEMP/urai-admin-pr57-provider-raw"
          rm -rf -- "$raw"
          mkdir -p "$raw" artifacts/provider

          project_json="$(gcloud projects describe "$STAGING_PROJECT_ID" --format=json)"
          project_number="$(PROJECT_JSON="$project_json" node -e "const p=JSON.parse(process.env.PROJECT_JSON); if(!p.projectNumber) process.exit(1); process.stdout.write(String(p.projectNumber))")"
          active_json="$(gcloud auth list --filter=status:ACTIVE --format=json)"
          provider_tail="${WIF_PROVIDER#*/workloadIdentityPools/}"
          pool_id="${provider_tail%%/*}"
          provider_id="${WIF_PROVIDER##*/}"
          provider_json="$(gcloud iam workload-identity-pools providers describe "$provider_id" --workload-identity-pool="$pool_id" --location=global --project="$STAGING_PROJECT_ID" --format=json)"
          project_iam="$(gcloud projects get-iam-policy "$STAGING_PROJECT_ID" --format=json)"
          effective_iam="$(gcloud asset get-effective-iam-policy --scope="projects/$STAGING_PROJECT_ID" --names="//cloudresourcemanager.googleapis.com/projects/$project_number" --format=json)"
          deploy_sa_iam="$(gcloud iam service-accounts get-iam-policy "$DEPLOY_SERVICE_ACCOUNT" --project="$STAGING_PROJECT_ID" --format=json)"
          keys_json="$(gcloud iam service-accounts keys list --iam-account="$DEPLOY_SERVICE_ACCOUNT" --project="$STAGING_PROJECT_ID" --format=json)"
          custom_roles="$(gcloud iam roles list --project="$STAGING_PROJECT_ID" --format=json)"
          functions_json="$(gcloud functions list --project="$STAGING_PROJECT_ID" --format=json)"
          run_json="$(gcloud run services list --platform=managed --project="$STAGING_PROJECT_ID" --format=json)"
          hosting_sites="$(firebase hosting:sites:list --project "$STAGING_PROJECT_ID" --json)"
          hosting_channels="$(firebase hosting:channel:list --project "$STAGING_PROJECT_ID" --json)"
          firebase_functions="$(firebase functions:list --project "$STAGING_PROJECT_ID" --json)"

          PROJECT_JSON="$project_json" ACTIVE_JSON="$active_json" PROVIDER_JSON="$provider_json" PROJECT_IAM="$project_iam" EFFECTIVE_IAM="$effective_iam" DEPLOY_SA_IAM="$deploy_sa_iam" KEYS_JSON="$keys_json" CUSTOM_ROLES="$custom_roles" FUNCTIONS_JSON="$functions_json" RUN_JSON="$run_json" HOSTING_SITES="$hosting_sites" HOSTING_CHANNELS="$hosting_channels" FIREBASE_FUNCTIONS="$firebase_functions" WIF_PROVIDER="$WIF_PROVIDER" DEPLOY_SERVICE_ACCOUNT="$DEPLOY_SERVICE_ACCOUNT" node <<'NODE'
          const fs = require('node:fs');
          const parse = (name) => { try { return JSON.parse(process.env[name]); } catch { throw new Error(`invalid JSON from required provider read: ${name}`); } };
          const project = parse('PROJECT_JSON');
          const active = parse('ACTIVE_JSON');
          const provider = parse('PROVIDER_JSON');
          const projectIam = parse('PROJECT_IAM');
          const effectiveIam = parse('EFFECTIVE_IAM');
          const deploySaIam = parse('DEPLOY_SA_IAM');
          const keys = parse('KEYS_JSON');
          const customRoles = parse('CUSTOM_ROLES');
          const functions = parse('FUNCTIONS_JSON');
          const runServices = parse('RUN_JSON');
          const hostingSites = parse('HOSTING_SITES');
          const hostingChannels = parse('HOSTING_CHANNELS');
          const firebaseFunctions = parse('FIREBASE_FUNCTIONS');
          const expectedCondition = "assertion.repository_owner_id=='215797546' && assertion.repository_id=='1150947098' && assertion.ref=='refs/heads/main' && assertion.environment=='staging'";
          const failures = [];
          const activePrincipal = active.find((entry) => entry.status === 'ACTIVE')?.account || active[0]?.account || null;
          if (project.projectId !== 'urai-staging' || !project.projectNumber) failures.push('project identity');
          if (activePrincipal !== process.env.DEPLOY_SERVICE_ACCOUNT) failures.push('authenticated principal');
          if (provider.name !== process.env.WIF_PROVIDER) failures.push('provider resource');
          if (provider.oidc?.issuerUri !== 'https://token.actions.githubusercontent.com') failures.push('issuer');
          if (provider.attributeCondition !== expectedCondition) failures.push('attribute condition');
          const mapping = provider.attributeMapping || {};
          for (const key of ['google.subject','attribute.repository_id','attribute.repository_owner_id','attribute.ref','attribute.environment']) if (!mapping[key]) failures.push(`mapping ${key}`);
          const userManagedKeys = Array.isArray(keys) ? keys.filter((key) => key.keyType === 'USER_MANAGED') : [];
          if (userManagedKeys.length) failures.push('user-managed service-account key');

          const effectiveBroadBindings = [];
          const visit = (value, attachedResource = null) => {
            if (!value || typeof value !== 'object') return;
            const here = value.attachedResource || value.fullResourceName || attachedResource;
            if (Array.isArray(value.bindings)) {
              for (const binding of value.bindings) {
                if (binding?.role === 'roles/owner' || binding?.role === 'roles/editor') {
                  effectiveBroadBindings.push({ attachedResource: here, role: binding.role, members: binding.members || [] });
                }
              }
            }
            for (const child of Object.values(value)) visit(child, here);
          };
          visit(effectiveIam);
          const target = `serviceAccount:${process.env.DEPLOY_SERVICE_ACCOUNT}`;
          const directBroad = effectiveBroadBindings.filter((b) => b.members.includes(target));
          const uncertainBroad = effectiveBroadBindings.filter((b) => b.members.some((m) =>
            m.startsWith('group:') || m.startsWith('domain:') || m === 'allAuthenticatedUsers' || m === 'allUsers' || m.startsWith('principalSet:') || m.startsWith('principal:')
          ));
          if (directBroad.length) failures.push('effective Owner/Editor reliance');
          if (uncertainBroad.length) failures.push('Owner/Editor group/broad-principal membership cannot be disproven');
          if (failures.length) throw new Error(`Provider read-only proof failed closed: ${failures.join(', ')}`);

          const runtimeIdentities = [];
          for (const fn of Array.isArray(functions) ? functions : []) {
            const email = fn?.serviceConfig?.serviceAccountEmail || fn?.serviceAccountEmail || null;
            if (email) runtimeIdentities.push({ kind: 'cloud-function', name: fn.name || null, serviceAccountEmail: email, state: fn.state || null, updateTime: fn.updateTime || null, environment: fn.environment || null });
          }
          for (const service of Array.isArray(runServices) ? runServices : []) {
            const email = service?.spec?.template?.spec?.serviceAccountName || service?.spec?.template?.spec?.serviceAccount || null;
            if (email) runtimeIdentities.push({ kind: 'cloud-run', name: service.metadata?.name || service.name || null, serviceAccountEmail: email, latestReadyRevisionName: service.status?.latestReadyRevisionName || null });
          }
          const directProjectRoles = (projectIam.bindings || []).filter((b) => (b.members || []).includes(target)).map((b) => b.role);
          fs.writeFileSync('artifacts/provider/provider-probe.json', `${JSON.stringify({
            schemaVersion: 'urai-admin-pr57-provider-probe-2',
            generatedAt: new Date().toISOString(),
            stagingRepository: process.env.GITHUB_REPOSITORY,
            stagingControllerSha: process.env.GITHUB_SHA,
            adminRepository: process.env.ADMIN_REPOSITORY,
            adminPullRequest: Number(process.env.ADMIN_PR_NUMBER),
            adminCandidateSha: process.env.ADMIN_SHA,
            workflowRunId: process.env.GITHUB_RUN_ID,
            projectId: project.projectId,
            projectNumber: String(project.projectNumber),
            probeMode: 'provider-read-only',
            mutationAuthorized: false,
            productionDeploymentApproved: false,
            credentialClass: 'GitHub OIDC + WIF + ephemeral ADC',
            authenticatedGooglePrincipal: activePrincipal,
            wifProvider: { resource: provider.name, state: provider.state || null, issuer: provider.oidc?.issuerUri || null, allowedAudiences: provider.oidc?.allowedAudiences || [], attributeMapping: mapping, attributeCondition: provider.attributeCondition || null },
            deployServiceAccountEmail: process.env.DEPLOY_SERVICE_ACCOUNT,
            deployServiceAccountDirectProjectRoles: directProjectRoles,
            deployServiceAccountIamBindings: deploySaIam.bindings || [],
            effectiveIamReadback: true,
            effectiveOwnerEditorBindings: effectiveBroadBindings,
            ownerEditorNegativeProof: directBroad.length === 0 && uncertainBroad.length === 0,
            ownerEditorGroupOrBroadPrincipalUncertainty: uncertainBroad,
            userManagedServiceAccountKeys: [],
            auditConfigs: projectIam.auditConfigs || [],
            customRoles: (Array.isArray(customRoles) ? customRoles : []).map((role) => ({ name: role.name, title: role.title, stage: role.stage, includedPermissions: role.includedPermissions || [] })),
            runtimeIdentities,
            hostingSites,
            hostingChannels,
            firebaseFunctions,
            requiredProviderReadsComplete: true,
            secretValuesIncluded: false,
          }, null, 2)}\n`);
          NODE
          rm -rf -- "$raw"

      - name: Destroy ephemeral WIF credential before evidence handoff
        if: always()
        shell: bash
        run: |
          rm -f -- "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          echo 'GOOGLE_APPLICATION_CREDENTIALS=' >> "$GITHUB_ENV"
          echo 'GOOGLE_GHA_CREDS_PATH=' >> "$GITHUB_ENV"

      - name: Write terminal probe summary
        if: always()
        shell: bash
        env:
          REQUIRE_WIF_OUTCOME: ${{ steps.require-wif.outcome }}
          AUTH_OUTCOME: ${{ steps.google-auth.outcome }}
          ADC_OUTCOME: ${{ steps.adc-boundary.outcome }}
          GCLOUD_OUTCOME: ${{ steps.setup-gcloud.outcome }}
          FIREBASE_CLI_OUTCOME: ${{ steps.firebase-cli.outcome }}
          PROVIDER_READ_OUTCOME: ${{ steps.provider-read.outcome }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/provider
          node <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync('artifacts/provider/summary.json', `${JSON.stringify({
            schemaVersion: 'urai-admin-pr57-provider-probe-summary-2',
            generatedAt: new Date().toISOString(),
            stagingControllerSha: process.env.GITHUB_SHA,
            adminCandidateSha: process.env.ADMIN_SHA,
            workflowRunId: process.env.GITHUB_RUN_ID,
            requireWifOutcome: process.env.REQUIRE_WIF_OUTCOME || 'skipped',
            authOutcome: process.env.AUTH_OUTCOME || 'skipped',
            adcBoundaryOutcome: process.env.ADC_OUTCOME || 'skipped',
            gcloudOutcome: process.env.GCLOUD_OUTCOME || 'skipped',
            firebaseCliOutcome: process.env.FIREBASE_CLI_OUTCOME || 'skipped',
            providerReadOutcome: process.env.PROVIDER_READ_OUTCOME || 'skipped',
            productionDeploymentPerformed: false,
            providerMutationPerformed: false,
          }, null, 2)}\n`);
          NODE

      - name: Upload exact provider probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: urai-admin-pr57-provider-probe-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/provider/
          if-no-files-found: error
          retention-days: 90

      - name: Enforce successful protected provider probe
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.require-wif.outcome }}' = 'success'
          test '${{ steps.google-auth.outcome }}' = 'success'
          test '${{ steps.adc-boundary.outcome }}' = 'success'
          test '${{ steps.setup-gcloud.outcome }}' = 'success'
          test '${{ steps.firebase-cli.outcome }}' = 'success'
          test '${{ steps.provider-read.outcome }}' = 'success'
