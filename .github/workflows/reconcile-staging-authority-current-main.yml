name: Reconcile staging authority onto current main

on:
  push:
    branches:
      - reconcile/staging-authority-current-main-20260714
    paths:
      - .github/workflows/reconcile-staging-authority-current-main.yml
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/reconcile-staging-authority-current-main.yml

permissions:
  contents: write

concurrency:
  group: reconcile-staging-authority-current-main-20260714
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.repository == 'LifeLoggerAI/urai-staging' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/reconcile/staging-authority-current-main-20260714') ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'reconcile/staging-authority-current-main-20260714'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AUTHORITY_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      AUTHORITY_BRANCH: reconcile/staging-authority-current-main-20260714
    steps:
      - name: Checkout exact reconciliation head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.AUTHORITY_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact clean authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORITY_SHA"
          test "${{ github.event_name }}" = "push" || test "${{ github.event.pull_request.head.ref }}" = "$AUTHORITY_BRANCH"
          test "$(git status --porcelain --untracked-files=all)" = ""
          git fetch --no-tags origin \
            refs/heads/fix/environment-authority-20260706:refs/remotes/origin/fix/environment-authority-20260706

      - name: Merge clean authority files and retain current conflict authorities
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/staging-reconciliation"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          git merge --no-commit --no-ff origin/fix/environment-authority-20260706 \
            > "$RUNNER_TEMP/staging-reconciliation/merge.log" 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > "$RUNNER_TEMP/staging-reconciliation/merge-exit.txt"

          if [ "$status" -eq 0 ]; then
            printf 'mode=clean\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only --diff-filter=U | sort > "$RUNNER_TEMP/staging-reconciliation/conflicts.txt"
          cat > "$RUNNER_TEMP/staging-reconciliation/expected-conflicts.txt" <<'EOF'
          .github/workflows/staging-deploy.yml
          .github/workflows/urai-production-verify.yml
          scripts/check-deploy-readiness.mjs
          scripts/urai-staging-lock.sh
          EOF
          sort -o "$RUNNER_TEMP/staging-reconciliation/expected-conflicts.txt" "$RUNNER_TEMP/staging-reconciliation/expected-conflicts.txt"

          if ! cmp -s "$RUNNER_TEMP/staging-reconciliation/conflicts.txt" "$RUNNER_TEMP/staging-reconciliation/expected-conflicts.txt"; then
            git merge --abort || true
            printf 'mode=unexpected\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          while IFS= read -r path; do
            git checkout --ours -- "$path"
            git add "$path"
          done < "$RUNNER_TEMP/staging-reconciliation/expected-conflicts.txt"
          git diff --name-only --diff-filter=U | tee "$RUNNER_TEMP/staging-reconciliation/remaining-conflicts.txt"
          test ! -s "$RUNNER_TEMP/staging-reconciliation/remaining-conflicts.txt"
          printf 'mode=partial\n' >> "$GITHUB_OUTPUT"

      - name: Upload reconciliation evidence
        if: steps.merge.outputs.mode != 'clean'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-authority-reconciliation-${{ env.AUTHORITY_SHA }}
          path: ${{ runner.temp }}/staging-reconciliation
          retention-days: 90
          if-no-files-found: error

      - name: Fail closed on unexpected conflicts
        if: steps.merge.outputs.mode == 'unexpected'
        shell: bash
        run: |
          echo 'Unexpected staging authority conflicts were retained. No branch mutation is authorized.'
          exit 1

      - name: Finalize bounded reconciliation
        if: steps.merge.outputs.mode == 'clean' || steps.merge.outputs.mode == 'partial'
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/reconcile-staging-authority-current-main.yml
          mkdir -p docs/release-evidence
          mode='${{ steps.merge.outputs.mode }}'
          cat > docs/release-evidence/STAGING_AUTHORITY_RECONCILIATION_20260714.md <<EOF
          # Staging authority reconciliation

          - Repository: LifeLoggerAI/urai-staging
          - Current-main base: e789f57d0428c200cb131327cfce963c9ef34792
          - Source authority branch: fix/environment-authority-20260706
          - Source authority head: 9568e09ad536f0fd936b316a5f4deb84fe1ff70d
          - Trigger SHA: $AUTHORITY_SHA
          - Reconciliation mode: $mode
          - Deployment performed: false
          - Credential mutation: false
          - Production mutation: false

          The clean, non-overlapping staging authority files were transferred onto current main.

          When reconciliation mode is partial, current-main authority was deliberately retained for these four overlapping controls pending focused review:

          - .github/workflows/staging-deploy.yml
          - .github/workflows/urai-production-verify.yml
          - scripts/check-deploy-readiness.mjs
          - scripts/urai-staging-lock.sh

          This receipt does not claim those four paths are reconciled. Exact-head validation, focused path reconciliation and independent review remain required before any protected staging operation.
          EOF
          git add docs/release-evidence/STAGING_AUTHORITY_RECONCILIATION_20260714.md
          git diff --cached --check
          git diff --cached --name-status

      - name: Commit bounded reconciliation
        if: steps.merge.outputs.mode == 'clean' || steps.merge.outputs.mode == 'partial'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "Reconcile non-overlapping staging authority onto current main"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin HEAD:$AUTHORITY_BRANCH
