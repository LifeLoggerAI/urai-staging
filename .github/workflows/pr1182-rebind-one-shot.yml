name: PR1182 Rebind One Shot

on:
  push:
    branches:
      - stripe/spatial-pr1182-test-runtime
    paths:
      - .github/workflows/pr1182-rebind-one-shot.yml

permissions:
  contents: write

jobs:
  rebind:
    if: github.event.head_commit.message == 'CI: execute PR1182 exact-head rebind'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: stripe/spatial-pr1182-test-runtime
          fetch-depth: 0
      - name: Rebind exact Spatial candidate and remove executor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/spatial-pr1182-stripe-provider-probe.yml')
          text = path.read_text()
          old = 'd671cb6cb85bc318086b9781fef9e572f143489e'
          new = 'f909c0e30c08b4307d6e8c248364227fd4e42820'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one stale default SHA, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/pr1182-rebind-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/spatial-pr1182-stripe-provider-probe.yml .github/workflows/pr1182-rebind-one-shot.yml
          git diff --cached --check
          git commit -m 'Staging: align PR1182 probe default to exact head'
          git push origin HEAD:stripe/spatial-pr1182-test-runtime
