name: Probe shared WIF for Asset Factory

on:
  push:
    branches:
      - agent/probe-shared-wif
    paths:
      - .github/workflows/probe-shared-wif.yml

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require protected staging WIF inputs
        env:
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.GCP_STAGING_DEPLOY_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WIF_PROVIDER" || { echo 'staging GCP_WIF_PROVIDER missing' >&2; exit 1; }
          test -n "$WIF_SERVICE_ACCOUNT" || { echo 'staging GCP_STAGING_DEPLOY_SERVICE_ACCOUNT missing' >&2; exit 1; }

      - name: Authenticate through staging WIF
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: urai-staging
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_STAGING_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: urai-staging

      - name: Read-only probe of central URAI project
        shell: bash
        run: |
          set -euo pipefail
          active_account="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n 1)"
          test -n "$active_account"
          central_number="$(gcloud projects describe urai-4dc1d --format='value(projectNumber)')"
          test -n "$central_number"
          echo "Central project number resolved: ${central_number}"
          echo 'Attempting read-only WIF pool visibility:'
          gcloud iam workload-identity-pools list --project=urai-4dc1d --location=global --format='table(name,state)' || true
          {
            echo '### Shared WIF read-only probe'
            echo "- Central project: urai-4dc1d"
            echo "- Central project number: ${central_number}"
            echo "- Active account: ${active_account}"
            echo '- Cloud mutation performed: no'
          } >> "$GITHUB_STEP_SUMMARY"
