name: UrAi Current Cross-Service Emulator Evidence

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: urai-current-cross-service-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  current-cross-service:
    name: Admin Privacy Jobs source contracts and real Firebase emulators (nonrelease)
    if: ${{ github.event.pull_request.number == 109 && github.event.pull_request.head.repo.full_name == 'LifeLoggerAI/urai-staging' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
      ADMIN_SHA: 8313188532aef304a3b55771c5080f87e4ac71eb
      PRIVACY_SHA: 809d94ad7fc93322780d13ff3f0bade7612b3ec2
      JOBS_SHA: 7e6cf28e9875c9d10c1ebf08e41c7da1be8db74f
      STORYTIME_SHA: f9f960a1d2a4d4ebdbade0aa70b08c507ffed7f4
      STUDIO_SHA: 4d13b8b4f66768c69d9e828f503ec65de0c85a16
      SPATIAL_C1_SHA: 4951e2bde4f6708cf2b83e6413f7f61748bb0dd0
      NO_GCE_CHECK: 'true'
      URAI_EMULATOR_PROJECT: urai-staging-test
    steps:
      - name: Checkout exact staging head without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify exact staging identity and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          test '${{ github.repository }}' = 'LifeLoggerAI/urai-staging'
          test '${{ github.event.pull_request.base.ref }}' = 'main'
          for sha in "$ADMIN_SHA" "$PRIVACY_SHA" "$JOBS_SHA" "$STORYTIME_SHA" "$STUDIO_SHA" "$SPATIAL_C1_SHA"; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          done
          test "$URAI_EMULATOR_PROJECT" = 'urai-staging-test'
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${FIREBASE_TOKEN:-}"

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Set up Java 21 for Firebase emulators
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'

      - name: Clone immutable public Admin Privacy Jobs heads and test contracts
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/urai-current-cross-repositories"
          mkdir -p "$root" artifacts/current-cross-service
          clone_at() {
            local name="$1" branch="$2" sha="$3" path="$root/$1"
            # GitHub shallow branch cloning only fetches current tip; the
            # pinned commit may be an earlier, now-unreachable shallow object.
            # Fetch EXACT immutable SHA instead, without force or branch movement.
            mkdir -p "$path"
            git -C "$path" init -q
            git -C "$path" remote add origin "https://github.com/LifeLoggerAI/$name.git"
            git -C "$path" -c protocol.version=2 fetch -q --no-tags --depth 1 origin "$sha"
            git -C "$path" checkout -q --detach FETCH_HEAD
            test "$(git -C "$path" rev-parse HEAD)" = "$sha"
            test -z "$(git -C "$path" status --porcelain --untracked-files=all)"
          }
          clone_at urai-admin repair/admin-security-privacy-20261007 "$ADMIN_SHA"
          clone_at urai-privacy repair/export-attempt-authority-20261007 "$PRIVACY_SHA"
          clone_at urai-jobs repair/life-movie-convergence-20261007 "$JOBS_SHA"
          clone_at urai-storytime codex/wave31-disposable-storytime-jobs-harness-20261014 "$STORYTIME_SHA"
          clone_at urai-studio repair/studio-convergence-20261007 "$STUDIO_SHA"
          (
            cd "$root/urai-admin"
            node scripts/test-institutional-control-plane-contract.mjs
            node scripts/test-firestore-rules-contract.mjs
          )
          (
            cd "$root/urai-privacy"
            node scripts/check-deletion-orchestration-contract.mjs
            node scripts/validate-rules.mjs
          )
          (
            cd "$root/urai-jobs"
            node scripts/consent-revocation-contract.mjs
            node scripts/runtime-job-admission-contract.mjs
          )
          # The existing Storytime runner's offline boundary checks are real
          # source tests. They are NOT connected Jobs/Studio emulator proof.
          (
            cd "$root/urai-storytime"
            node --test tests/unit/storytime-jobs-staging-acceptance.test.mjs
          )
          for name in urai-admin urai-privacy urai-jobs urai-storytime urai-studio; do
            test -z "$(git -C "$root/$name" status --porcelain --untracked-files=all)"
          done
          # Cross-owner SOURCE binding check. Actual Auth/Firestore/Functions/
          # Storage emulator execution remains the separate next stage below.
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const root = join(process.env.RUNNER_TEMP, 'urai-current-cross-repositories');
          const read = (owner, file) => readFileSync(join(root, owner, file), 'utf8');
          const story = read('urai-storytime', 'functions/src/storytime.ts');
          const narrator = read('urai-jobs', 'functions/src/jobs/storytimeNarratorBridge.ts');
          const studioAuth = read('urai-studio', 'apps/studio/lib/studio-life-movie-longform-auth.ts');
          const studioContract = read('urai-studio', 'apps/studio/lib/studio-life-movie-longform-contract.ts');
          const jobsContract = read('urai-jobs', 'functions/src/jobs/studioLifeMovieLongformContract.ts');
          assert.ok(story.includes('storytimeJobsBridgeRequest({') && story.includes('boundStorytimeRemoteJob(bridge, externalJobId)'));
          assert.ok(story.includes('decisionReceiptId: consentReceiptId'));
          assert.ok(narrator.includes("z.literal('storytime.voiceover')") && narrator.includes("action: z.literal('create')"));
          assert.ok(narrator.includes('narratorPlaybackAuthority(') && narrator.includes('outputDeletionState'));
          assert.ok(studioAuth.includes('memberships/${auth.uid}_${auth.tenantId}') && studioAuth.includes('refreshStudioLongformAuth('));
          assert.ok(studioContract.includes("schemaVersion: 'urai-life-movie-longform-v1'"));
          assert.ok(jobsContract.includes("z.literal('urai-life-movie-longform-v1')"));
          const mainPin = /jobsSourceSha:\s*'([0-9a-f]{40})'/.exec(studioContract)?.[1];
          assert.match(mainPin ?? '', /^[0-9a-f]{40}$/);
          const receipt = {
            schemaVersion: 'urai-standalone-cinema-source-bindings-1',
            stagingSourceSha: process.env.TARGET_SHA,
            sourceHeads: { storytime: process.env.STORYTIME_SHA, jobs: process.env.JOBS_SHA,
              studio: process.env.STUDIO_SHA, privacy: process.env.PRIVACY_SHA },
            storytimeToJobs: { createConsentAndRemoteJobIdentityContractLocated: true,
              authorizationAndDeletionImplementationLocated: true },
            studioToJobs: { schemaVersion: 'urai-life-movie-longform-v1',
              studioPinnedJobsMainSha: mainPin, candidateJobsOwnerSha: process.env.JOBS_SHA,
              ownerEqualsPinnedMain: mainPin === process.env.JOBS_SHA,
              requiresDeliberateJobsOwnerSourceAdmission: mainPin !== process.env.JOBS_SHA },
            evidenceLevel: 'READ_ONLY_EXACT_SOURCE_AND_STORYTIME_OFFLINE_TESTS',
            crossServiceRuntimeAccepted: false, protectedStagingAccepted: false,
            authenticatedStudioDispatchVerified: false, privateLifeMovieAccepted: false,
            providerSpendingOrProductionMutation: false,
          };
          writeFileSync('artifacts/current-cross-service/standalone-source-bindings.json',
            JSON.stringify(receipt, null, 2) + '\n');
          console.log(JSON.stringify({ sourceCompatibility: 'EXACT_OWNER_SOURCES_IDENTIFIED',
            studioJobsSourceRequiresReview: receipt.studioToJobs.requiresDeliberateJobsOwnerSourceAdmission }));
          NODE
          node --input-type=module - <<'NODE'
          import { writeFileSync } from 'node:fs';
          const receipt = {
            schemaVersion: 'urai-current-cross-repository-source-contracts-1',
            environment: 'credential-free-public-exact-head',
            stagingSourceSha: process.env.TARGET_SHA,
            sourceHeads: {
              admin: process.env.ADMIN_SHA,
              privacy: process.env.PRIVACY_SHA,
              jobs: process.env.JOBS_SHA,
              storytime: process.env.STORYTIME_SHA,
              studio: process.env.STUDIO_SHA,
            },
            executed: [
              'admin institutional control and Firestore rules contracts',
              'privacy deletion orchestration and static rules contracts',
              'jobs consent revocation and runtime-job admission contracts',
            ],
            upstreamSourceIdentitiesVerified: true,
            executedAgainstRealDeployedServices: false,
            crossServiceRuntimeIntegrationVerified: false,
            mutations: false,
            productionAccessAuthorized: false,
          };
          writeFileSync('artifacts/current-cross-service/source-contracts.json', JSON.stringify(receipt, null, 2) + '\n');
          NODE

      - name: Install locked staging functions dependencies and build
        run: |
          set -euo pipefail
          npm --prefix functions ci --ignore-scripts --no-audit --no-fund
          npm --prefix functions run build

      - name: Verify exact canonical Spatial Life Graph consent and temporal authority source
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/urai-current-cross-repositories/urai-spatial"
          git clone -q --no-checkout --depth 1 --branch proof/current-c1-memory-graph-fence-20261014 \
            "https://github.com/LifeLoggerAI/urai-spatial.git" "$root"
          git -C "$root" checkout -q --detach "$SPATIAL_C1_SHA"
          test "$(git -C "$root" rev-parse HEAD)" = "$SPATIAL_C1_SHA"
          test -z "$(git -C "$root" status --porcelain --untracked-files=all)"
          test -d "$GITHUB_WORKSPACE/functions/node_modules/typescript"
          # Actual unmodified Spatial production module and its source-level
          # regression tests; staging's locked TypeScript dependency only.
          ln -s "$GITHUB_WORKSPACE/functions/node_modules" "$root/node_modules"
          (
            cd "$root"
            node --test \
              urai-tier1/tests/life-graph-authority-behavior.test.mjs \
              urai-tier1/tests/person-state-authority-behavior.test.mjs
          )
          rm "$root/node_modules"
          test -z "$(git -C "$root" status --porcelain --untracked-files=all)"
          node --input-type=module - <<'NODE'
          import { writeFileSync } from 'node:fs';
          const receipt = {
            schemaVersion: 'urai-canonical-spatial-c1-source-tests-1',
            stagingSourceSha: process.env.TARGET_SHA,
            spatialExactSha: process.env.SPATIAL_C1_SHA,
            sourceBranch: 'proof/current-c1-memory-graph-fence-20261014',
            testModules: [
              'urai-tier1/tests/life-graph-authority-behavior.test.mjs',
              'urai-tier1/tests/person-state-authority-behavior.test.mjs',
            ],
            coverage: [
              'current canonical C1 consent revoked before Jobs block',
              'expired missing malformed or foreign C1 grant',
              'current Life Graph source binding and SceneTruth',
              'owner-scoped temporal authority and transaction retries',
            ],
            actualCanonicalSourceUnderTest: true,
            mockedDatabaseServiceInTheseSourceTests: true,
            separateActualFirebaseEmulatorStepRequired: true,
            cloudStagingAccepted: false,
            productionDataProcessed: false,
            providerOrHostingMutations: false,
          };
          writeFileSync('artifacts/current-cross-service/canonical-spatial-contract.json',
            JSON.stringify(receipt, null, 2) + '\n');
          NODE

      - name: Execute real Auth Functions Firestore Storage emulators
        shell: bash
        env:
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
          FIREBASE_FUNCTIONS_EMULATOR_HOST: 127.0.0.1:5001
          URAI_CROSS_SERVICE_RECEIPT: ${{ github.workspace }}/artifacts/current-cross-service/authenticated-emulator.json
        run: |
          set -euo pipefail
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${FIREBASE_TOKEN:-}"
          test "$URAI_EMULATOR_PROJECT" = 'urai-staging-test'
          NO_GCE_CHECK=true functions/node_modules/.bin/firebase emulators:exec \
            --project "$URAI_EMULATOR_PROJECT" \
            --config firebase.json \
            --only auth,firestore,storage,functions \
            "node functions/test/current-cross-service.emulator.mjs"

      - name: Preserve exact-head current cross-service evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: urai-current-cross-service-${{ env.TARGET_SHA }}-${{ github.run_id }}
          path: artifacts/current-cross-service/
          if-no-files-found: warn
          retention-days: 90
