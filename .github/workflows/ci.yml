name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: urai-staging-ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  functions:
    name: Functions and staging readiness checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Prove exact clean head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Setup Java 21 for Firebase emulators
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate staging deploy workflow definition
        run: node scripts/validate-staging-deploy-workflow.mjs

      - name: Validate Admin PR57 provider probe definition
        run: node scripts/validate-admin-pr57-provider-probe.mjs

      - name: Validate staging WIF bootstrap contract
        run: node scripts/validate-staging-wif-bootstrap.mjs

      - name: Bootstrap staging validation
        run: node scripts/urai-staging-bootstrap.mjs

      - name: Validate launch evidence
        run: node scripts/validate-launch-evidence.mjs

      - name: Upload staging launch evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: urai-staging-launch-evidence-${{ env.TARGET_SHA }}-${{ github.run_id }}
          path: |
            artifacts/launch/staging-bootstrap-report.json
            artifacts/launch/staging-bootstrap-summary.md
          if-no-files-found: error
          retention-days: 90

  cross-service:
    name: Confined Admin Privacy Jobs exact-head verification
    if: >-
      (github.event_name == 'pull_request' && github.head_ref == 'workstream-c-manual-verification-20260711') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/workstream-c-manual-verification-20260711')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Prove exact clean head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup Java 21 for Firebase emulators
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Capture confined cross-service verification
        id: cross_service
        shell: bash
        run: |
          set +e
          set -o pipefail
          evidence_dir="$RUNNER_TEMP/workstream-c-evidence"
          rm -rf -- "$evidence_dir"
          mkdir -p -- "$evidence_dir"

          bash scripts/run-workstream-c-cloud-shell.sh 2>&1 | tee "$evidence_dir/verifier.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$evidence_dir/exit-code.txt"

          root="$(find /tmp -maxdepth 1 -type d -name 'urai-workstream-c-manual-*' -print | sort | tail -n 1)"
          if [ -n "$root" ] && [ -d "$root/evidence" ]; then
            cp -a "$root/evidence/." "$evidence_dir/"
          fi

          {
            echo "verifier_sha=$TARGET_SHA"
            echo "admin_sha=$(sed -n "s/^ADMIN_SHA='\([^']*\)'/\1/p" scripts/workstream-c-current-candidates.env)"
            echo "privacy_sha=$(sed -n "s/^PRIVACY_SHA='\([^']*\)'/\1/p" scripts/workstream-c-current-candidates.env)"
            echo "jobs_sha=$(sed -n "s/^JOBS_SHA='\([^']*\)'/\1/p" scripts/workstream-c-current-candidates.env)"
            echo "credentialed=false"
            echo "protected_apply=false"
          } > "$evidence_dir/authority.env"

          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload confined cross-service evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: urai-workstream-c-cross-service-${{ env.TARGET_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/workstream-c-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Prove final clean head
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Enforce confined cross-service result
        shell: bash
        run: test "${{ steps.cross_service.outputs.status }}" = '0'
