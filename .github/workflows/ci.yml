name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: urai-staging-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  functions:
    name: Functions and staging readiness checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Prove exact clean head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Setup Java 21 for Firebase emulators
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Test native SendGrid staging approval preflight
        run: node --test scripts/test-sendgrid-staging-approval.mjs

      - name: Validate staging deploy workflow definition
        run: node scripts/validate-staging-deploy-workflow.mjs

      - name: Verify fail-closed real Spatial export staging assembler
        run: npm run test:consumer-staging

      - name: Validate staging WIF bootstrap contract
        run: node scripts/validate-staging-wif-bootstrap.mjs

      - name: Validate staging WIF runtime identity probe
        run: node scripts/validate-staging-wif-runtime-identity-probe.mjs

      - name: Validate staging consumer authority
        run: node scripts/validate-staging-consumers.mjs

      - name: Fail closed on stale publicly-resolvable active consumer refs
        run: node scripts/validate-active-consumer-refs.mjs

      - name: Validate protected private consumer ref workflow
        run: node scripts/validate-private-consumer-ref-workflow.mjs

      - name: Validate Spatial PR1596 Stripe TEST provider probe
        run: node scripts/validate-spatial-pr1596-stripe-provider-probe.mjs

      - name: Validate Communications PR75 Twilio staging controller
        run: node scripts/validate-communications-pr58-twilio-staging.mjs

      - name: Validate Communications PR75 SendGrid signed staging controller
        run: node scripts/validate-communications-pr58-sendgrid-staging.mjs

      - name: Validate bounded Twilio staging IAM authority
        run: node scripts/validate-staging-twilio-proof-iam.mjs

      - name: Validate staging Functions deploy IAM promotion
        run: node scripts/validate-staging-twilio-function-deploy-iam.mjs

      - name: Validate staging billing fail-closed contract
        run: node scripts/validate-staging-billing-guard.mjs

      - name: Validate multi-model provider readiness truth boundaries
        run: npm run validate:providers

      - name: Bootstrap staging validation
        run: node scripts/urai-staging-bootstrap.mjs

      - name: Validate launch evidence
        run: node scripts/validate-launch-evidence.mjs

      - name: Upload staging launch evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: urai-staging-launch-evidence-${{ env.TARGET_SHA }}-${{ github.run_id }}
          path: |
            artifacts/launch/staging-bootstrap-report.json
            artifacts/launch/staging-bootstrap-summary.md
            artifacts/launch/staging-installed-security.json
          if-no-files-found: error
          retention-days: 90

  cross-service:
    name: Confined Admin Privacy Jobs exact-head verification
    if: >-
      (github.event_name == 'pull_request' && github.head_ref == 'workstream-c-manual-verification-20260711') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/workstream-c-manual-verification-20260711')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Prove exact clean head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup Java 21 for Firebase emulators
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Capture confined cross-service verification
        id: cross_service
        shell: bash
        run: |
          set +e
          set -o pipefail
          evidence_dir="$RUNNER_TEMP/workstream-c-evidence"
          rm -rf -- "$evidence_dir"
          mkdir -p -- "$evidence_dir"

          bash scripts/run-workstream-c-cloud-shell.sh 2>&1 | tee "$evidence_dir/verifier.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$evidence_dir/exit-code.txt"

          root="$(find /tmp -maxdepth 1 -type d -name 'urai-workstream-c-manual-*' -print | sort | tail -n 1)"
          if [ -n "$root" ] && [ -d "$root/evidence" ]; then
            cp -a "$root/evidence/." "$evidence_dir/"
          fi

          {
            echo "verifier_sha=$TARGET_SHA"
            echo "admin_sha=$(sed -n "s/^ADMIN_SHA='\([^']*\)'/\1/p" scripts/workstream-c-current-candidates.env)"
            echo "privacy_sha=$(sed -n "s/^PRIVACY_SHA='\([^']*\)'/\1/p" scripts/workstream-c-current-candidates.env)"
            echo "jobs_sha=$(sed -n "s/^JOBS_SHA='\([^']*\)'/\1/p" scripts/workstream-c-current-candidates.env)"
            echo "credentialed=false"
            echo "protected_apply=false"
          } > "$evidence_dir/authority.env"

          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload confined cross-service evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: urai-workstream-c-cross-service-${{ env.TARGET_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/workstream-c-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Prove final clean head
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Enforce confined cross-service result
        shell: bash
        run: test "${{ steps.cross_service.outputs.status }}" = '0'


  # Browser acceptance of genuine source-pinned static bytes (not an app rebuild,
  # substitute fixture, production deploy, or staging Firebase mutation).
  native-consumer-browser:
    name: Real native-assembled consumer Chromium proof (non-release)
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 109
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact current staging controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Prove immutable staging source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Retrieve the actual immutable Spatial export from its source run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/LifeLoggerAI/urai-spatial/actions/artifacts/11772021946/zip \
            --output "$RUNNER_TEMP/urai-real-source.zip"
          echo 'f1f3ec5657feb62fd6c8cc3fc39ed4acb1c1e8828b1b34ce6e052f281adcdfcc  '"$RUNNER_TEMP/urai-real-source.zip" | sha256sum --check

      - name: Validate and safely extract all 1522 real compiled files
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-spatial-export-artifact.py \
            --archive "$RUNNER_TEMP/urai-real-source.zip" \
            --out "$RUNNER_TEMP/urai-source-extracted"

      - name: Execute existing native assembler on actual compiled export
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-consumer-staging-bundle.mjs \
            --spatial-export "$RUNNER_TEMP/urai-source-extracted/urai-tier1/out" \
            --out "$RUNNER_TEMP/urai-native-output" \
            --candidate config/spatial-consumer-candidate.json

      - name: Prove native package byte-equivalence to founder verified artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-spatial-export-artifact.py \
            --archive "$RUNNER_TEMP/urai-real-source.zip" \
            --out "$RUNNER_TEMP/urai-source-extracted" \
            --native "$RUNNER_TEMP/urai-native-output"

      - name: Install real Playwright Chromium in the isolated runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/urai-browser"
          npm install --prefix "$RUNNER_TEMP/urai-browser" --no-save --no-package-lock --no-audit --no-fund playwright@1.57.0
          "$RUNNER_TEMP/urai-browser/node_modules/.bin/playwright" install --with-deps chromium

      - name: Serve only the native assembler output and exercise real Chromium
        shell: bash
        env:
          URAI_NATIVE_BASE_URL: http://127.0.0.1:4173
        run: |
          set -euo pipefail
          mkdir -p artifacts/native-consumer-browser
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$RUNNER_TEMP/urai-native-output/public" \
            > artifacts/native-consumer-browser/http-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/home/ --output /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/api/system/deploy-proof --output /dev/null
          URAI_NATIVE_OUTPUT="$RUNNER_TEMP/urai-native-output" \
          URAI_PLAYWRIGHT_ROOT="$RUNNER_TEMP/urai-browser" \
          URAI_BROWSER_EVIDENCE=artifacts/native-consumer-browser \
          node scripts/verify-native-consumer-browser.mjs

      - name: Retain native Chromium screenshots and failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: urai-native-real-browser-${{ env.TARGET_SHA }}
          path: artifacts/native-consumer-browser/
          if-no-files-found: warn
          retention-days: 90

      - name: Prove staging controller source was never modified
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code
          git diff --cached --exit-code
