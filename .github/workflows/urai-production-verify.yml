name: URAI Production Verify

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: urai-staging-production-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: Verify exact staging candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Prove exact clean head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Setup Java 21 for Firebase emulators
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install exact functions dependency graph
        run: npm --prefix functions ci --ignore-scripts --engine-strict --audit=false

      - name: Prove install preserved exact source
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=all)"

      - name: Run canonical staging bootstrap
        run: node scripts/urai-staging-bootstrap.mjs

      - name: Validate launch evidence
        run: node scripts/validate-launch-evidence.mjs

      - name: Run repository production-verification suite
        run: node scripts/urai-production-verify.mjs

      - name: Upload exact-head staging verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: urai-staging-production-verify-${{ env.TARGET_SHA }}-${{ github.run_id }}
          path: |
            artifacts/launch/staging-bootstrap-report.json
            artifacts/launch/staging-bootstrap-summary.md
            artifacts/launch/staging-installed-security.json
          if-no-files-found: error
          retention-days: 90
