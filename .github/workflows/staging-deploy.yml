name: Staging Deploy Lock

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: 'Exact current main SHA to verify and, when requested, deploy'
        required: true
        type: string
      confirm_staging_project:
        description: 'Type the exact Firebase staging project ID'
        required: true
        type: string
      run_live_deploy:
        description: 'Deploy to Firebase staging after exact-main verification'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: urai-staging-deploy-lock
  cancel-in-progress: false

env:
  TARGET_SHA: ${{ inputs.expected_main_sha }}
  EXPECTED_STAGING_PROJECT: urai-staging
  URAI_STAGING_PROJECT_ID: urai-staging
  URAI_STAGING_URL: https://urai-staging.web.app
  URAI_PRODUCTION_DEPLOY_APPROVED: '0'

jobs:
  verify:
    name: Verify exact protected staging authority
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      target_sha: ${{ steps.authority.outputs.target_sha }}
    steps:
      - name: Validate manual dispatch authority
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          test '${{ github.ref }}' = 'refs/heads/main'
          test '${{ inputs.confirm_staging_project }}' = "$EXPECTED_STAGING_PROJECT"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test '${{ github.sha }}' = "$TARGET_SHA"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact main authority
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Prove exact clean current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          remote_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_main_sha" = "$TARGET_SHA"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Setup Java 21 for Firebase emulators
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install exact Functions dependency graph
        run: npm --prefix functions ci --ignore-scripts

      - name: Run protected staging checks
        shell: bash
        run: |
          set -euo pipefail
          npm run doctor
          npm run check:deploy
          npm run check:lockfile
          npm run lint
          npm run typecheck
          npm run build
          npm run test:unit
          npm run test:rules
          npm run test:e2e

      - name: Prove verification preserved exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Write checks-only authority receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/deploy
          {
            echo '# URAI Staging Protected Authority Verification'
            echo
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Exact main SHA: $TARGET_SHA"
            echo "- Run ID: $GITHUB_RUN_ID"
            echo "- Staging project: $EXPECTED_STAGING_PROJECT"
            echo "- Live deploy requested: ${{ inputs.run_live_deploy }}"
            echo "- Credentialed: false"
            echo "- Protected apply: false"
            echo "- Generated: $(date -u +%FT%TZ)"
          } > artifacts/deploy/staging-authority-verification.md

      - name: Upload checks-only authority receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: urai-staging-authority-${{ env.TARGET_SHA }}-${{ github.run_id }}
          path: artifacts/deploy/staging-authority-verification.md
          if-no-files-found: error
          retention-days: 90

  deploy:
    name: Deploy exact main to protected staging
    if: ${{ inputs.run_live_deploy }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: staging
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout exact verified main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify.outputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Re-prove protected deployment authority
        shell: bash
        run: |
          set -euo pipefail
          test '${{ github.ref }}' = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          remote_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_main_sha" = "$TARGET_SHA"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Setup Java 21 for Firebase emulators
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install exact deployment tooling
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix functions ci --ignore-scripts
          npm install --global --prefix "$RUNNER_TEMP/firebase-cli" firebase-tools@15.23.0 --ignore-scripts
          echo "$RUNNER_TEMP/firebase-cli/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/firebase-cli/bin/firebase" --version

      - name: Require protected WIF deploy identity
        shell: bash
        env:
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_STAGING_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$WIF_PROVIDER" || { echo 'GCP_WIF_PROVIDER is required; stored Firebase service-account credentials are prohibited.' >&2; exit 1; }
          test -n "$DEPLOY_SERVICE_ACCOUNT" || { echo 'GCP_STAGING_DEPLOY_SERVICE_ACCOUNT is required; stored Firebase service-account credentials are prohibited.' >&2; exit 1; }

      - name: Authenticate to Google Cloud with WIF
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: urai-staging
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_STAGING_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Verify ephemeral WIF credential boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -f "$GOOGLE_APPLICATION_CREDENTIALS"
          test -n "${GOOGLE_GHA_CREDS_PATH:-}"
          test "$GOOGLE_APPLICATION_CREDENTIALS" = "$GOOGLE_GHA_CREDS_PATH"
          case "$GOOGLE_APPLICATION_CREDENTIALS" in
            "$GITHUB_WORKSPACE"/gha-creds-*.json) ;;
            *) echo 'WIF credential must be the ephemeral google-github-actions file under GITHUB_WORKSPACE.' >&2; exit 1 ;;
          esac
          git check-ignore -q "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Initialize protected deploy receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/deploy
          {
            echo '# URAI Staging Protected Deploy Receipt'
            echo
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Exact main SHA: $TARGET_SHA"
            echo "- Run ID: $GITHUB_RUN_ID"
            echo "- Environment: staging"
            echo "- Firebase project: $EXPECTED_STAGING_PROJECT"
            echo "- Staging URL: $URAI_STAGING_URL"
            echo "- Credential class: WIF/ephemeral ADC"
            echo "- Started: $(date -u +%FT%TZ)"
          } > artifacts/deploy/staging-protected-deploy.md

      - name: Run locked staging deploy with WIF
        id: deploy
        env:
          URAI_STAGING_PROTECTED_DEPLOY: '1'
          URAI_RELEASE_CANDIDATE_SHA: ${{ env.TARGET_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          npm run deploy:staging
          test -f URAI_STAGING_LOCK.md

      - name: Finalize protected deploy receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "- Deploy step outcome: ${{ steps.deploy.outcome }}"
            echo "- Finished: $(date -u +%FT%TZ)"
            if [ -f URAI_STAGING_LOCK.md ]; then
              echo '- Lock receipt generated: true'
              grep -q -- "$TARGET_SHA" URAI_STAGING_LOCK.md
              grep -q -- "$EXPECTED_STAGING_PROJECT" URAI_STAGING_LOCK.md
              grep -q -- "$URAI_STAGING_URL" URAI_STAGING_LOCK.md
            else
              echo '- Lock receipt generated: false'
            fi
          } >> artifacts/deploy/staging-protected-deploy.md
          cat artifacts/deploy/staging-protected-deploy.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload protected staging deploy evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: urai-staging-protected-deploy-${{ env.TARGET_SHA }}-${{ github.run_id }}
          path: |
            URAI_STAGING_LOCK.md
            URAI_STAGING_LOCK_FAILED.md
            artifacts/deploy/staging-protected-deploy.md
          if-no-files-found: error
          retention-days: 90
