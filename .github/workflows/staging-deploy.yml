name: Staging Deploy Lock

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed repository SHA to verify and optionally deploy
        required: true
        type: string
      rollback_sha:
        description: Distinct approved ancestor SHA for rollback
        required: true
        type: string
      confirm_staging_project:
        description: Type urai-staging to confirm the exact Firebase project
        required: true
        type: string
      run_live_deploy:
        description: Deploy verified artifact to Firebase staging
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: urai-staging-deploy-lock
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  FIREBASE_CLI_VERSION: '13.35.1'
  EXPECTED_STAGING_PROJECT: urai-staging
  URAI_STAGING_URL: https://urai-staging.web.app

jobs:
  preflight:
    name: Credential-free exact-head staging preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      TARGET_SHA: ${{ inputs.expected_sha }}
      ROLLBACK_SHA: ${{ inputs.rollback_sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source, rollback, and project confirmation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ROLLBACK_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$TARGET_SHA" != "$ROLLBACK_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git cat-file -e "$ROLLBACK_SHA^{commit}"
          git merge-base --is-ancestor "$ROLLBACK_SHA" "$TARGET_SHA"
          test "${{ inputs.confirm_staging_project }}" = "$EXPECTED_STAGING_PROJECT"

      - name: Setup Node
        uses: actions/setup-node@1e60f620b9541d80c77f7b4a3bcd8bf5e940c37 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@3a4f6e1f28df1e8c45b7e9d141dcfa563c465761 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run exact-head staging verification without cloud credentials
        run: |
          node scripts/urai-staging-bootstrap.mjs
          npm run test:e2e
          node scripts/validate-launch-evidence.mjs

      - name: Create and verify source-bound staging artifact
        env:
          URAI_RELEASE_CANDIDATE_SHA: ${{ env.TARGET_SHA }}
        run: |
          node scripts/staging-prebuilt-manifest.mjs --write
          node scripts/staging-prebuilt-manifest.mjs --verify-materialized

      - name: Write credential-free preflight receipt
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p artifacts/deploy
          node - <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync('artifacts/deploy/staging-preflight.json', `${JSON.stringify({
            schemaVersion: 'urai-staging-preflight-1',
            generatedAt: new Date().toISOString(),
            repository: process.env.GITHUB_REPOSITORY,
            workflowRunId: process.env.GITHUB_RUN_ID,
            sourceSha: process.env.TARGET_SHA,
            rollbackSha: process.env.ROLLBACK_SHA,
            projectId: process.env.EXPECTED_STAGING_PROJECT,
            status: process.env.JOB_STATUS,
            cloudAuthenticated: false,
            deploymentPerformed: false,
            authorityScope: 'urai-staging-repository-only',
            consumerAssignments: [],
            crossSystemMutationAuthorized: false,
          }, null, 2)}\n`);
          NODE

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: urai-staging-preflight-${{ inputs.expected_sha }}
          path: |
            artifacts/deploy/staging-preflight.json
            artifacts/launch/staging-bootstrap-report.json
            artifacts/launch/staging-bootstrap-summary.md
          if-no-files-found: error
          retention-days: 90

      - name: Upload exact staging prebuilt artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: urai-staging-prebuilt-${{ inputs.expected_sha }}
          path: |
            .firebaserc
            firebase.json
            firestore.indexes.json
            firestore.rules
            functions/lib/
            functions/package-lock.json
            functions/package.json
            public/
            storage.rules
            artifacts/prebuilt/staging-prebuilt-manifest.json
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Protected staging mutation
    needs: preflight
    if: ${{ inputs.run_live_deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      actions: read
    env:
      TARGET_SHA: ${{ inputs.expected_sha }}
      ROLLBACK_SHA: ${{ inputs.rollback_sha }}
      PREBUILT_ROOT: ${{ runner.temp }}/urai-staging-prebuilt
      GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/urai-staging-service-account.json
    steps:
      - name: Checkout exact clean mutation authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@1e60f620b9541d80c77f7b4a3bcd8bf5e940c37 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Verify exact clean mutation source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git merge-base --is-ancestor "$ROLLBACK_SHA" "$TARGET_SHA"

      - name: Download prebuilt artifact outside repository
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: urai-staging-prebuilt-${{ inputs.expected_sha }}
          path: ${{ env.PREBUILT_ROOT }}

      - name: Verify external artifact before credentials exist
        env:
          URAI_RELEASE_CANDIDATE_SHA: ${{ env.TARGET_SHA }}
          URAI_STAGING_PREBUILT_ROOT: ${{ env.PREBUILT_ROOT }}
        run: |
          node scripts/staging-prebuilt-manifest.mjs --verify-external
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Install exact Firebase CLI outside repository
        shell: bash
        run: |
          set -euo pipefail
          CLI_ROOT="$RUNNER_TEMP/firebase-cli"
          mkdir -p "$CLI_ROOT"
          npm install --prefix "$CLI_ROOT" --no-audit --no-fund "firebase-tools@$FIREBASE_CLI_VERSION"
          test "$("$CLI_ROOT/node_modules/.bin/firebase" --version)" = "$FIREBASE_CLI_VERSION"
          echo "$CLI_ROOT/node_modules/.bin" >> "$GITHUB_PATH"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Materialize verified Functions output before credentials exist
        env:
          URAI_RELEASE_CANDIDATE_SHA: ${{ env.TARGET_SHA }}
          URAI_STAGING_PREBUILT_ROOT: ${{ env.PREBUILT_ROOT }}
        run: node scripts/staging-prebuilt-manifest.mjs --materialize

      - name: Require exact staging credential
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_URAI_STAGING: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_URAI_STAGING }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_URAI_STAGING"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_URAI_STAGING" > "$GOOGLE_APPLICATION_CREDENTIALS"
          chmod 600 "$GOOGLE_APPLICATION_CREDENTIALS"
          node -e '
            const fs=require("fs");
            const value=JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,"utf8"));
            if(value.project_id!==process.env.EXPECTED_STAGING_PROJECT) throw new Error("Credential project mismatch");
          '

      - name: Deploy verified artifact to staging only
        env:
          FIREBASE_PROJECT_ID: urai-staging
          URAI_STAGING_PROJECT_ID: urai-staging
          URAI_STAGING_DEPLOY_CONFIRM: DEPLOY_URAI_STAGING
          URAI_RELEASE_CANDIDATE_SHA: ${{ env.TARGET_SHA }}
          URAI_STAGING_ROLLBACK_SHA: ${{ env.ROLLBACK_SHA }}
          URAI_STAGING_PREFLIGHT_VERIFIED: '1'
          URAI_STAGING_AUTHORITY_SCOPE: urai-staging-repository-only
          URAI_STAGING_CONSUMER_ASSIGNMENTS_JSON: '[]'
          URAI_FIREBASE_CLI_VERSION: ${{ env.FIREBASE_CLI_VERSION }}
          URAI_PRODUCTION_DEPLOY_APPROVED: '0'
          ALLOW_CREATE_STAGING_HOSTING_SITE: '0'
        run: bash scripts/urai-staging-lock.sh

      - name: Destroy staging credentials before evidence handoff
        if: always()
        shell: bash
        run: |
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
          echo 'GOOGLE_APPLICATION_CREDENTIALS=' >> "$GITHUB_ENV"

      - name: Upload mutation evidence after credential cleanup
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: urai-staging-mutation-${{ inputs.expected_sha }}
          path: |
            artifacts/deploy/firebase-hosting-sites.json
            artifacts/deploy/firebase-deploy.log
            artifacts/deploy/staging-mutation-receipt.json
            artifacts/prebuilt/staging-prebuilt-manifest.json
            URAI_STAGING_LOCK_FAILED.md
          if-no-files-found: warn
          retention-days: 365

  public-verify:
    name: Public staging verification without cloud identity
    needs: deploy
    if: ${{ inputs.run_live_deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      TARGET_SHA: ${{ inputs.expected_sha }}
      ROLLBACK_SHA: ${{ inputs.rollback_sha }}
    steps:
      - name: Checkout exact public verifier source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@1e60f620b9541d80c77f7b4a3bcd8bf5e940c37 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download mutation evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: urai-staging-mutation-${{ inputs.expected_sha }}
          path: mutation-evidence

      - name: Bind public verification to mutation receipt
        shell: bash
        run: |
          set -euo pipefail
          RECEIPT="$(find mutation-evidence -type f -name staging-mutation-receipt.json -print -quit)"
          test -n "$RECEIPT"
          RECEIPT="$RECEIPT" node - <<'NODE'
          const fs=require('fs');
          const receipt=JSON.parse(fs.readFileSync(process.env.RECEIPT,'utf8'));
          const failures=[];
          if(receipt.schemaVersion!=='urai-staging-mutation-1') failures.push('schema');
          if(receipt.sourceSha!==process.env.TARGET_SHA) failures.push('source SHA');
          if(receipt.rollbackSha!==process.env.ROLLBACK_SHA) failures.push('rollback SHA');
          if(receipt.projectId!=='urai-staging'||receipt.hostingSite!=='urai-staging') failures.push('staging identity');
          if(receipt.authorityScope!=='urai-staging-repository-only') failures.push('authority scope');
          if(!Array.isArray(receipt.consumerAssignments)||receipt.consumerAssignments.length!==0) failures.push('consumer assignments');
          if(receipt.crossSystemMutationAuthorized!==false) failures.push('cross-system boundary');
          if(receipt.deploymentCommandCompleted!==true||receipt.secretValuesIncluded!==false) failures.push('mutation result');
          if(receipt.publicVerificationCompleted!==false) failures.push('phase state');
          if(failures.length) throw new Error(`Staging mutation receipt mismatch: ${failures.join(', ')}`);
          NODE

      - name: Run non-mutating live smoke
        id: live_smoke
        env:
          URAI_STAGING_PROJECT_ID: urai-staging
          URAI_STAGING_URL: https://urai-staging.web.app
          URAI_RELEASE_CANDIDATE_SHA: ${{ env.TARGET_SHA }}
        run: bash scripts/smoke-staging.sh

      - name: Finalize outcome-exact staging lock
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          SMOKE_OUTCOME: ${{ steps.live_smoke.outcome }}
        run: |
          mkdir -p artifacts/deploy
          node - <<'NODE'
          const fs=require('fs');
          const verified=process.env.SMOKE_OUTCOME==='success';
          const receipt={
            schemaVersion:'urai-staging-public-verification-1',
            generatedAt:new Date().toISOString(),
            repository:process.env.GITHUB_REPOSITORY,
            workflowRunId:process.env.GITHUB_RUN_ID,
            sourceSha:process.env.TARGET_SHA,
            rollbackSha:process.env.ROLLBACK_SHA,
            projectId:'urai-staging',
            hostingSite:'urai-staging',
            hostingUrl:'https://urai-staging.web.app',
            status:process.env.JOB_STATUS,
            smokeOutcome:process.env.SMOKE_OUTCOME||'not-run',
            cloudAuthenticated:false,
            authorityScope:'urai-staging-repository-only',
            consumerAssignments:[],
            crossSystemMutationAuthorized:false,
            publicVerificationCompleted:verified,
          };
          fs.writeFileSync('artifacts/deploy/staging-public-verification.json',`${JSON.stringify(receipt,null,2)}\n`);
          const lines=['# URAI Staging Lock','',`- Exact source SHA: ${receipt.sourceSha}`,`- Approved rollback SHA: ${receipt.rollbackSha}`,`- Firebase project: ${receipt.projectId}`,`- Hosting site: ${receipt.hostingSite}`,`- Hosting URL: ${receipt.hostingUrl}`,`- Public smoke: ${receipt.smokeOutcome}`,`- Cloud authenticated during public verification: no`,`- Cross-system mutation authority: none`,`- Release classification: ${verified?'STAGING VERIFIED':'BLOCKED'}`,''];
          fs.writeFileSync('URAI_STAGING_LOCK.md',`${lines.join('\n')}\n`);
          NODE

      - name: Upload final public verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: urai-staging-public-verification-${{ inputs.expected_sha }}
          path: |
            URAI_STAGING_LOCK.md
            artifacts/deploy/staging-public-verification.json
          if-no-files-found: error
          retention-days: 365
