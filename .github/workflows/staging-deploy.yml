name: Staging Deploy Lock

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact reviewed repository SHA to verify and optionally deploy"
        required: true
        type: string
      rollback_sha:
        description: "Distinct approved ancestor SHA for rollback"
        required: true
        type: string
      confirm_staging_project:
        description: "Type the exact Firebase staging project ID to allow deploy"
        required: true
        type: string
      run_live_deploy:
        description: "Deploy to Firebase staging after checks pass"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: urai-staging-deploy-lock
  cancel-in-progress: false

jobs:
  staging-lock:
    name: Staging deploy lock
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    env:
      EXPECTED_STAGING_PROJECT: urai-staging
      URAI_STAGING_PROJECT_ID: urai-staging
      URAI_STAGING_URL: https://urai-staging.web.app
      URAI_PRODUCTION_DEPLOY_APPROVED: "0"
      ALLOW_CREATE_STAGING_HOSTING_SITE: "0"
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/.firebase-service-account.json
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact commit and rollback authority
        shell: bash
        run: |
          set -euo pipefail
          sha_pattern='^[0-9a-f]{40}$'
          [[ "${{ inputs.expected_sha }}" =~ $sha_pattern ]] || {
            echo "expected_sha must be a full lowercase 40-character SHA" >&2
            exit 1
          }
          [[ "${{ inputs.rollback_sha }}" =~ $sha_pattern ]] || {
            echo "rollback_sha must be a full lowercase 40-character SHA" >&2
            exit 1
          }
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "${{ inputs.expected_sha }}"
          test -z "$(git status --porcelain --untracked-files=all)"
          git cat-file -e "${{ inputs.rollback_sha }}^{commit}"
          test "$actual_sha" != "${{ inputs.rollback_sha }}"
          git merge-base --is-ancestor "${{ inputs.rollback_sha }}" "$actual_sha" || {
            echo "rollback_sha must be an ancestor of expected_sha" >&2
            exit 1
          }
          echo "TARGET_SHA=$actual_sha" >> "$GITHUB_ENV"
          echo "ROLLBACK_SHA=${{ inputs.rollback_sha }}" >> "$GITHUB_ENV"

      - name: Start deploy evidence summary
        run: |
          mkdir -p artifacts/deploy
          {
            echo "# URAI Staging Deploy Lock Evidence"
            echo ""
            echo "- Workflow: Staging Deploy Lock"
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Commit: $TARGET_SHA"
            echo "- Rollback SHA: $ROLLBACK_SHA"
            echo "- Run ID: $GITHUB_RUN_ID"
            echo "- Staging project: $EXPECTED_STAGING_PROJECT"
            echo "- Staging URL: $URAI_STAGING_URL"
            echo "- Live deploy requested: ${{ inputs.run_live_deploy }}"
            echo "- Started at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "## Guardrails"
            echo ""
            echo "- Manual dispatch only."
            echo "- Protected staging environment."
            echo "- Exact target and ancestor rollback SHAs required."
            echo "- Exact staging project confirmation required."
            echo "- Clean exact workflow checkout verified."
            echo "- Production approval flag forced to 0."
            echo "- Infrastructure creation forced off."
            echo ""
          } > artifacts/deploy/staging-deploy-summary.md

      - name: Validate dispatch guard
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm_staging_project }}" != "$EXPECTED_STAGING_PROJECT" ]; then
            echo "Refusing deploy: confirm_staging_project must be $EXPECTED_STAGING_PROJECT" >&2
            exit 1
          fi
          echo "- Dispatch guard: passed" >> artifacts/deploy/staging-deploy-summary.md

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13.35.1

      - name: Run exact-head staging verification
        run: node scripts/urai-staging-bootstrap.mjs

      - name: Validate launch evidence
        run: node scripts/validate-launch-evidence.mjs

      - name: Require and validate staging credentials
        if: ${{ inputs.run_live_deploy }}
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_URAI_STAGING: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_URAI_STAGING }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_URAI_STAGING" ]; then
            echo "Missing staging Firebase credential secret; cannot deploy." >&2
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_URAI_STAGING" > "$GOOGLE_APPLICATION_CREDENTIALS"
          python -m json.tool "$GOOGLE_APPLICATION_CREDENTIALS" > /dev/null
          chmod 600 "$GOOGLE_APPLICATION_CREDENTIALS"
          project_id="$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("project_id", ""))' "$GOOGLE_APPLICATION_CREDENTIALS")"
          if [ "$project_id" != "$EXPECTED_STAGING_PROJECT" ]; then
            echo "Credential project mismatch: expected $EXPECTED_STAGING_PROJECT" >&2
            exit 1
          fi
          echo "- Staging credentials: valid for expected project" >> artifacts/deploy/staging-deploy-summary.md

      - name: Deploy lock to Firebase staging
        if: ${{ inputs.run_live_deploy }}
        env:
          URAI_RELEASE_CANDIDATE_SHA: ${{ env.TARGET_SHA }}
          URAI_STAGING_ROLLBACK_SHA: ${{ env.ROLLBACK_SHA }}
        run: npm run deploy:staging

      - name: Mark deploy mode
        if: always()
        run: |
          {
            echo ""
            echo "## Final workflow mode"
            echo ""
            if [ "${{ inputs.run_live_deploy }}" = "true" ]; then
              if [ -f URAI_STAGING_LOCK.md ]; then
                echo "- Live deploy: completed and lock file generated."
              else
                echo "- Live deploy: requested, but lock file was not generated. Review job logs."
              fi
            else
              echo "- Live deploy: not requested. Checks-only evidence generated."
            fi
            echo "- Finished at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> artifacts/deploy/staging-deploy-summary.md
          cat artifacts/deploy/staging-deploy-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Remove staging credential file
        if: always()
        shell: bash
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Upload staging deploy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urai-staging-deploy-lock-${{ inputs.expected_sha }}
          path: |
            URAI_STAGING_LOCK.md
            URAI_STAGING_LOCK_FAILED.md
            artifacts/deploy/staging-deploy-summary.md
            artifacts/launch/staging-bootstrap-report.json
            artifacts/launch/staging-bootstrap-summary.md
          if-no-files-found: warn
          retention-days: 365
