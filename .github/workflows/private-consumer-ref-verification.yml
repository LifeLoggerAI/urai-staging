name: Protected Private Consumer Ref Verification

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: urai-staging-private-consumer-ref-verification
  cancel-in-progress: true

jobs:
  verify:
    name: Verify private active consumer refs without mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    env:
      CROSS_REPO_READ_TOKEN: ${{ secrets.URAI_CROSS_REPO_READ_TOKEN }}
      CROSS_REPO_READ_SSH_KEY: ${{ secrets.URAI_CROSS_REPO_READ_SSH_KEY }}
    steps:
      - name: Checkout exact current staging authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify protected/private consumer exact refs
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-private-consumer-refs.mjs

      - name: Upload sanitized private consumer ref evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: urai-staging-private-consumer-refs-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/private-consumer-refs/receipt.json
          if-no-files-found: error
          retention-days: 90
